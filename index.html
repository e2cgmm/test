<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Editor Pro</title>
    <style>
      :root {
        --bg: #edf2f8;
        --bg-2: #f7fafd;
        --panel: #ffffff;
        --panel-2: #f8fafc;
        --line: #dfe7f2;
        --line-strong: #c8d4e4;
        --text: #1b2430;
        --muted: #606d7b;
        --primary: #2a6df4;
        --primary-soft: rgba(42,109,244,0.12);
        --danger: #d93025;
        --success: #2f9e44;
        --warning: #f5c24c;
        --shadow: 0 18px 38px rgba(15, 23, 42, 0.09);
        --page-bg: #ffffff;
        --page-text: #111827;
        --ruler-bg: #f7faff;
      }

      body.dark {
        --bg: #101923;
        --bg-2: #142231;
        --panel: #1b2633;
        --panel-2: #182534;
        --line: #30435c;
        --line-strong: #405a77;
        --text: #edf5ff;
        --muted: #a8b8cc;
        --primary: #7ab0ff;
        --primary-soft: rgba(122, 176, 255, 0.15);
        --danger: #ff7d6d;
        --success: #6bd382;
        --warning: #ffd975;
        --shadow: 0 18px 38px rgba(0,0,0,0.38);
        --page-bg: #1a2430;
        --page-text: #ecf4ff;
        --ruler-bg: #1e2a38;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      body {
        transition: background 0.2s ease, color 0.2s ease;
      }

      button, input, select {
        font: inherit;
      }

      .word-app {
        min-height: 100vh;
        padding: 14px 18px 28px;
      }

      .shell {
        max-width: 1380px;
        margin: 0 auto;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #f7f9ff;
        border-bottom: 1px solid var(--line);
        padding: 10px 18px;
      }
      body.dark .titlebar {
        background: #141f2d;
      }

      .window-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .dot.red { background: #ff5f57; }
      .dot.yellow { background: #ffbd2f; }
      .dot.green { background: #28c840; }

      .app-name {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
      }
      .brand {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        color: white;
        font-weight: 700;
        background: linear-gradient(135deg, #4ea1ff, #1d5eda);
      }
      .app-name h1 {
        margin: 0;
        font-size: 15px;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn, .tool-btn, .tab-btn, .switch {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        border-radius: 10px;
        cursor: pointer;
        transition: 0.15s ease;
      }
      .btn, .tool-btn, .tab-btn {
        padding: 8px 12px;
      }
      .btn:hover, .tool-btn:hover, .tab-btn:hover {
        border-color: var(--line-strong);
        background: var(--panel-2);
      }
      .btn.primary {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }
      .btn.primary:hover {
        filter: brightness(0.96);
      }

      .ribbon {
        background: #edf3ff;
        border-bottom: 1px solid var(--line);
        padding: 8px 18px 0;
      }
      body.dark .ribbon {
        background: #162536;
      }

      .tab-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        overflow-x: auto;
      }
      .tab-btn {
        background: transparent;
        border-color: transparent;
        color: var(--muted);
        font-weight: 600;
      }
      .tab-btn.active {
        background: rgba(42,109,244,0.08);
        border-color: var(--line);
        color: var(--text);
      }

      .tab-panel {
        display: none;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 0 12px;
      }
      .tab-panel.active {
        display: flex;
      }

      .group {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-right: 8px;
        border-right: 1px solid var(--line);
      }
      .group:last-child { border-right: none; }
      .tool-btn { min-width: 42px; }

      .dropdown {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
      }

      .statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 10px 18px;
        background: var(--panel-2);
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .status-left {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .switch {
        width: 42px;
        height: 24px;
        border: none;
        background: #d3d8e2;
        position: relative;
        border-radius: 999px;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: white;
        transition: 0.2s ease;
      }
      .switch.active {
        background: var(--primary);
      }
      .switch.active::after {
        left: 22px;
      }

      .workspace {
        background: var(--bg-2);
        padding: 20px 18px 26px;
      }
      .page-shell {
        max-width: 1080px;
        margin: 0 auto;
      }
      .ruler {
        height: 26px;
        border: 1px solid var(--line);
        background: var(--ruler-bg);
        border-bottom: none;
        border-radius: 10px 10px 0 0;
        display: none;
        position: relative;
        overflow: hidden;
      }
      .ruler.show { display: block; }
      .ruler::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(to right, transparent 0, transparent 19px, rgba(92, 102, 116, 0.38) 19px, rgba(92, 102, 116, 0.38) 20px);
      }

      .page {
        background: var(--page-bg);
        color: var(--page-text);
        border: 1px solid var(--line);
        border-radius: 0 0 12px 12px;
        min-height: 840px;
        transition: all 0.2s ease;
      }
      .page.reading {
        max-width: 760px;
        margin: 0 auto;
      }
      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(42,109,244,0.03);
      }
      .doc-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
      }
      .doc-stats {
        font-size: 12px;
        color: var(--muted);
      }
      .editor-wrap {
        padding: 18px 18px 30px;
      }
      .editor {
        min-height: 760px;
        width: 100%;
        outline: none;
        background: transparent;
        color: var(--page-text);
        padding: 36px 44px 30px;
        font-size: 18px;
        line-height: 1.8;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .editor:empty:before {
        content: "여기에 문서를 입력하세요";
        color: #a0aebd;
      }
      .editor.track-changes .track {
        background: rgba(255,215,120,0.34);
        border-radius: 4px;
      }
      .page-break {
        border-top: 2px dashed #aabbd2;
        margin: 16px 0;
      }
      .comment-flag {
        background: rgba(42,109,244,0.09);
        border: 1px solid rgba(42,109,244,0.26);
        border-radius: 6px;
        padding: 0 4px;
      }
      .citation {
        color: var(--primary);
        font-weight: 700;
      }
      .footnote {
        color: var(--primary);
        font-size: 11px;
        vertical-align: super;
      }
      .hidden-file { display: none; }

      @media (max-width: 900px) {
        .titlebar { flex-wrap: wrap; }
        .editor { padding: 20px 18px 20px; }
        .group { border-right: none; }
      }
    </style>
  </head>
  <body>
    <div class="word-app">
      <div class="shell">
        <div class="titlebar">
          <div class="window-controls">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
          </div>

          <div class="app-name">
            <div class="brand">W</div>
            <h1>Word App</h1>
          </div>

          <div class="top-actions">
            <button class="btn" id="newDocBtn" type="button">새 문서</button>
            <button class="btn primary" id="downloadBtn" type="button">다운로드</button>
          </div>
        </div>

        <div class="ribbon">
          <div class="tab-bar">
            <button class="tab-btn active" data-tab="home" type="button">홈</button>
            <button class="tab-btn" data-tab="insert" type="button">삽입</button>
            <button class="tab-btn" data-tab="design" type="button">디자인</button>
            <button class="tab-btn" data-tab="layout" type="button">레이아웃</button>
            <button class="tab-btn" data-tab="references" type="button">참조</button>
            <button class="tab-btn" data-tab="review" type="button">검토</button>
            <button class="tab-btn" data-tab="view" type="button">보기</button>
          </div>

          <div class="tab-panel active" data-panel="home">
            <div class="group">
              <select id="fontFamilySelect" class="dropdown" aria-label="폰트 선택">
                <option value="Segoe UI">Segoe UI</option>
                <option value="Arial">Arial</option>
                <option value="Georgia">Georgia</option>
                <option value="Verdana">Verdana</option>
                <option value="Tahoma">Tahoma</option>
                <option value="Malgun Gothic">맑은 고딕</option>
                <option value="NanumGothic">나눔고딕</option>
              </select>
              <select id="fontSizeSelect" class="dropdown" aria-label="글자 크기 선택">
                <option value="">크기</option>
                <option value="1">8pt</option>
                <option value="2">10pt</option>
                <option value="3">12pt</option>
                <option value="4">14pt</option>
                <option value="5">18pt</option>
                <option value="6">24pt</option>
                <option value="7">32pt</option>
              </select>
            </div>

            <div class="group">
              <button class="tool-btn" data-command="bold" type="button"><strong>B</strong></button>
              <button class="tool-btn" data-command="italic" type="button"><em>I</em></button>
              <button class="tool-btn" data-command="underline" type="button"><span style="text-decoration: underline;">U</span></button>
            </div>

            <div class="group">
              <button class="tool-btn" data-command="insertUnorderedList" type="button">• 목록</button>
              <button class="tool-btn" data-command="insertOrderedList" type="button">1. 목록</button>
            </div>

            <div class="group">
              <button class="tool-btn" data-command="justifyLeft" type="button">◀</button>
              <button class="tool-btn" data-command="justifyCenter" type="button">☰</button>
              <button class="tool-btn" data-command="justifyRight" type="button">▶</button>
            </div>

            <div class="group">
              <button class="tool-btn" data-command="foreColor" type="button">글자색</button>
              <button class="tool-btn" data-command="hiliteColor" type="button">형광펜</button>
              <button class="tool-btn" data-command="removeFormat" type="button">서식 제거</button>
            </div>
          </div>

          <div class="tab-panel" data-panel="insert">
            <div class="group">
              <button class="tool-btn" data-command="insertTable" type="button">표 추가</button>
              <button class="tool-btn" data-command="insertImage" type="button">이미지</button>
              <button class="tool-btn" data-command="insertLink" type="button">링크</button>
              <button class="tool-btn" data-command="insertPageBreak" type="button">페이지 나누기</button>
            </div>
            <div class="group">
              <button class="tool-btn" data-command="insertComment" type="button">주석</button>
              <button class="tool-btn" data-command="insertCitation" type="button">출처</button>
            </div>
          </div>

          <div class="tab-panel" data-panel="design">
            <div class="group">
              <button class="tool-btn" data-command="pageColor" type="button">페이지 색상</button>
              <button class="tool-btn" data-command="setThemeLight" type="button">라이트</button>
              <button class="tool-btn" data-command="setThemeDark" type="button">다크</button>
            </div>
            <div class="group">
              <label for="lineSpacingSelect" style="color: var(--muted); font-size: 13px;">줄 간격</label>
              <select id="lineSpacingSelect" class="dropdown">
                <option value="1.2">보통</option>
                <option value="1.5">1.5배</option>
                <option value="1.8">1.8배</option>
                <option value="2">2.0배</option>
              </select>
            </div>
          </div>

          <div class="tab-panel" data-panel="layout">
            <div class="group">
              <button class="tool-btn" data-command="marginNarrow" type="button">좁게</button>
              <button class="tool-btn" data-command="marginNormal" type="button">보통</button>
              <button class="tool-btn" data-command="marginWide" type="button">넓게</button>
            </div>
            <div class="group">
              <button class="tool-btn" data-command="landscape" type="button">가로</button>
              <button class="tool-btn" data-command="portrait" type="button">세로</button>
            </div>
            <div class="group">
              <button class="tool-btn" data-command="toggleColumns" type="button">2단 보기</button>
            </div>
          </div>

          <div class="tab-panel" data-panel="references">
            <div class="group">
              <button class="tool-btn" data-command="insertCitation" type="button">참고문헌</button>
              <button class="tool-btn" data-command="insertFootnote" type="button">각주</button>
              <button class="tool-btn" data-command="insertPageMark" type="button">페이지 번호</button>
            </div>
          </div>

          <div class="tab-panel" data-panel="review">
            <div class="group">
              <button class="tool-btn" data-command="toggleTrack" type="button">변경 추적</button>
              <button class="tool-btn" data-command="insertComment" type="button">주석 추가</button>
            </div>
            <div class="group">
              <button class="tool-btn" data-command="checkSpelling" type="button">맞춤법 확인</button>
            </div>
          </div>

          <div class="tab-panel" data-panel="view">
            <div class="group">
              <button class="tool-btn" data-command="toggleRuler" type="button">눈금자</button>
              <button class="tool-btn" data-command="readingMode" type="button">읽기 모드</button>
            </div>
            <div class="group">
              <select id="zoomSelect" class="dropdown">
                <option value="1">100%</option>
                <option value="0.9">90%</option>
                <option value="1.1">110%</option>
                <option value="1.25">125%</option>
              </select>
            </div>
          </div>
        </div>

        <div class="statusbar">
          <div class="status-left">
            <div class="toggle">
              <span>맞춤법 검사</span>
              <button id="spellToggle" class="switch active" type="button" aria-label="맞춤법 검사 온오프"></button>
            </div>
            <div class="toggle">
              <span>다크모드</span>
              <button id="darkToggle" class="switch" type="button" aria-label="다크모드 온오프"></button>
            </div>
          </div>
          <div id="statusText">문서 준비 완료</div>
        </div>

        <div class="workspace">
          <div class="page-shell">
            <div id="ruler" class="ruler"></div>
            <div id="page" class="page">
              <div class="page-header">
                <div class="doc-title">문서 1</div>
                <div id="docStats" class="doc-stats">0단어 / 0자</div>
              </div>
              <div class="editor-wrap">
                <div id="editor" class="editor" contenteditable="true" spellcheck="true" aria-label="문서 편집기">
                  <p style="margin: 0 0 10px 0;"><strong>워드 앱</strong></p>
                  <p style="margin: 0 0 10px 0;">여기에 문서를 작성하면 홈·삽입·디자인·레이아웃·참조·검토·보기 탭의 기능이 실제로 동작합니다.</p>
                  <p style="margin: 0 0 10px 0;">글꼴 업로드, 다크모드, 맞춤법 검사, 이미지 첨부, 표 삽입, 링크, 각주, 출처, 페이지 나누기 기능을 사용할 수 있습니다.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <input id="imageInput" class="hidden-file" type="file" accept="image/*" />
    <input id="fontInput" class="hidden-file" type="file" accept=".ttf,.otf,.woff,.woff2" />

    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script>
      const editor = document.getElementById('editor');
      const page = document.getElementById('page');
      const docStats = document.getElementById('docStats');
      const statusText = document.getElementById('statusText');
      const ruler = document.getElementById('ruler');
      const fontFamilySelect = document.getElementById('fontFamilySelect');
      const fontSizeSelect = document.getElementById('fontSizeSelect');
      const lineSpacingSelect = document.getElementById('lineSpacingSelect');
      const zoomSelect = document.getElementById('zoomSelect');
      const spellToggle = document.getElementById('spellToggle');
      const darkToggle = document.getElementById('darkToggle');
      const imageInput = document.getElementById('imageInput');
      const fontInput = document.getElementById('fontInput');

      function setStatus(msg) {
        statusText.textContent = msg;
      }

      function updateStats() {
        const text = editor.innerText.replace(/\s+/g, ' ').trim();
        const words = text ? text.split(' ').length : 0;
        const chars = editor.innerText.replace(/\n/g, '').length;
        docStats.textContent = `${words}단어 / ${chars}자`;
      }

      function applyCommand(commandName, value = null) {
        document.execCommand(commandName, false, value);
        editor.focus();
        updateStats();
      }

      function setSpellcheck(enabled) {
        editor.spellcheck = enabled;
        spellToggle.classList.toggle('active', enabled);
        setStatus(enabled ? '맞춤법 검사 켜짐' : '맞춤법 검사 꺼짐');
      }

      function setDarkMode(enabled) {
        document.body.classList.toggle('dark', enabled);
        darkToggle.classList.toggle('active', enabled);
        setStatus(enabled ? '다크모드 켜짐' : '다크모드 꺼짐');
      }

      function setTheme(mode) {
        setDarkMode(mode === 'dark');
      }

      function updateFont() {
        const selected = fontFamilySelect.value;
        if (selected) {
          applyCommand('fontName', selected);
        }
      }

      function updateFontSize() {
        const size = fontSizeSelect.value;
        if (size) {
          applyCommand('fontSize', size);
        }
      }

      function insertTable() {
        const html = '<table style="width:100%; border-collapse: collapse; margin: 12px 0;">' +
          '<tr><td style="border: 1px solid #c9d3e0; padding: 8px;">&nbsp;</td><td style="border: 1px solid #c9d3e0; padding: 8px;">&nbsp;</td></tr>' +
          '<tr><td style="border: 1px solid #c9d3e0; padding: 8px;">&nbsp;</td><td style="border: 1px solid #c9d3e0; padding: 8px;">&nbsp;</td></tr>' +
          '</table>';
        document.execCommand('insertHTML', false, html);
        editor.focus();
        updateStats();
      }

      function insertImageFromFile(file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = `<img src="${ev.target.result}" alt="추가 이미지" style="max-width: 320px; border-radius: 10px; display:block; margin: 12px 0;" />`;
          document.execCommand('insertHTML', false, img);
          editor.focus();
          setStatus('이미지가 문서에 삽입되었습니다.');
        };
        reader.readAsDataURL(file);
      }

      function insertLink() {
        const url = prompt('링크 URL을 입력하세요:', 'https://');
        if (!url) return;
        document.execCommand('createLink', false, url);
        editor.focus();
      }

      function insertPageBreak() {
        document.execCommand('insertHTML', false, '<div class="page-break"></div><p></p>');
        editor.focus();
      }

      function insertComment() {
        const comment = prompt('주석 내용을 입력하세요:', '주석');
        if (!comment) return;
        document.execCommand('insertHTML', false, `<span class="comment-flag">[${comment}]</span> `);
        editor.focus();
      }

      function insertCitation() {
        const text = prompt('출처를 입력하세요:', '출처');
        if (!text) return;
        document.execCommand('insertHTML', false, `<span class="citation">[${text}]</span>`);
        editor.focus();
      }

      function insertFootnote() {
        document.execCommand('insertHTML', false, '<span class="footnote">[각주]</span>');
        editor.focus();
      }

      function insertPageMark() {
        document.execCommand('insertHTML', false, '<span style="color: var(--primary); font-weight: 700;">[페이지 번호]</span>');
        editor.focus();
      }

      function toggleTrackChanges() {
        editor.classList.toggle('track-changes');
        const active = editor.classList.contains('track-changes');
        setStatus(active ? '변경 추적 켜짐' : '변경 추적 꺼짐');
      }

      function checkSpelling() {
        const len = editor.innerText.trim().split(/\s+/).filter(Boolean).length;
        setStatus(`${len}개 단어를 확인했습니다. (브라우저 기본 맞춤법 검사 기준)`);
      }

      function pageColor() {
        const color = prompt('페이지 배경색을 입력하세요 (예: #ffffff, #f3f8ff):', '#ffffff');
        if (!color) return;
        page.style.background = color;
      }

      function marginNarrow() { editor.style.padding = '18px 22px'; }
      function marginNormal() { editor.style.padding = '36px 44px'; }
      function marginWide() { editor.style.padding = '52px 60px'; }

      function setOrientation(isLandscape) {
        if (isLandscape) {
          page.style.maxWidth = '1200px';
          page.style.minHeight = '640px';
          setStatus('가로 방향으로 변경됨');
        } else {
          page.style.maxWidth = '1080px';
          page.style.minHeight = '840px';
          setStatus('세로 방향으로 변경됨');
        }
      }

      function toggleColumns() {
        const current = editor.style.columnCount;
        editor.style.columnCount = current === '2' ? '1' : '2';
        editor.style.columnGap = '24px';
        setStatus(current === '2' ? '1단 보기로 전환' : '2단 보기로 전환');
      }

      function toggleRuler() {
        ruler.classList.toggle('show');
        setStatus(ruler.classList.contains('show') ? '눈금자 표시' : '눈금자 숨김');
      }

      function readingMode() {
        page.classList.toggle('reading');
        setStatus(page.classList.contains('reading') ? '읽기 모드 켜짐' : '읽기 모드 꺼짐');
      }

      function addCustomFont(file) {
        const name = file.name.replace(/\.[^/.]+$/, '');
        const src = URL.createObjectURL(file);
        const fontFace = new FontFace(name, `url(${src})`);

        fontFace.load().then((loaded) => {
          document.fonts.add(loaded);
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          fontFamilySelect.appendChild(option);
          fontFamilySelect.value = name;
          applyCommand('fontName', name);
          setStatus(`${name} 글꼴이 적용되었습니다.`);
        }).catch(() => {
          setStatus(`${file.name} 글꼴을 불러오지 못했습니다.`);
        });
      }

      function exportDocx() {
        const text = editor.innerText;
        const paragraphs = text.split(/\n+/).filter(line => line.trim().length > 0).map(line => ({ text: line.trim() }));

        if (!paragraphs.length) {
          setStatus('저장할 문서 내용이 없습니다.');
          return;
        }

        const { Document, Packer, Paragraph, TextRun } = docx;
        const doc = new Document({
          sections: [{
            properties: {},
            children: paragraphs.map((para) => new Paragraph({
              children: [new TextRun({ text: para.text, size: 24 })],
            })),
          }],
        });

        Packer.toBlob(doc).then((blob) => {
          saveAs(blob, 'document.docx');
          setStatus('DOCX 파일이 다운로드되었습니다.');
        }).catch(() => {
          setStatus('DOCX 생성 중 오류가 발생했습니다.');
        });
      }

      document.querySelectorAll('.tab-btn').forEach((tab) => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach((btn) => btn.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach((panel) => panel.classList.remove('active'));
          tab.classList.add('active');
          const panel = document.querySelector('[data-panel="' + tab.dataset.tab + '"]');
          if (panel) panel.classList.add('active');
        });
      });

      document.querySelectorAll('[data-command]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const command = btn.dataset.command;

          if (command === 'bold' || command === 'italic' || command === 'underline' || command === 'insertUnorderedList' || command === 'insertOrderedList' || command === 'justifyLeft' || command === 'justifyCenter' || command === 'justifyRight' || command === 'removeFormat') {
            applyCommand(command);
            return;
          }

          if (command === 'foreColor') {
            const color = prompt('글자색을 입력하세요 (예: #2a6df4, red):', '#2a6df4');
            if (color) applyCommand('foreColor', color);
            return;
          }

          if (command === 'hiliteColor') {
            const color = prompt('형광펜 색을 입력하세요 (예: yellow):', 'yellow');
            if (color) applyCommand('hiliteColor', color);
            return;
          }

          if (command === 'insertTable') { insertTable(); return; }
          if (command === 'insertImage') { imageInput.click(); return; }
          if (command === 'insertLink') { insertLink(); return; }
          if (command === 'insertPageBreak') { insertPageBreak(); return; }
          if (command === 'insertComment') { insertComment(); return; }
          if (command === 'insertCitation') { insertCitation(); return; }
          if (command === 'insertFootnote') { insertFootnote(); return; }
          if (command === 'insertPageMark') { insertPageMark(); return; }
          if (command === 'pageColor') { pageColor(); return; }
          if (command === 'setThemeLight') { setTheme('light'); return; }
          if (command === 'setThemeDark') { setTheme('dark'); return; }
          if (command === 'marginNarrow') { marginNarrow(); return; }
          if (command === 'marginNormal') { marginNormal(); return; }
          if (command === 'marginWide') { marginWide(); return; }
          if (command === 'landscape') { setOrientation(true); return; }
          if (command === 'portrait') { setOrientation(false); return; }
          if (command === 'toggleColumns') { toggleColumns(); return; }
          if (command === 'toggleRuler') { toggleRuler(); return; }
          if (command === 'readingMode') { readingMode(); return; }
          if (command === 'toggleTrack') { toggleTrackChanges(); return; }
          if (command === 'checkSpelling') { checkSpelling(); return; }

          setStatus('지원하지 않는 명령입니다.');
        });
      });

      fontFamilySelect.addEventListener('change', updateFont);
      fontSizeSelect.addEventListener('change', updateFontSize);
      lineSpacingSelect.addEventListener('change', (e) => {
        editor.style.lineHeight = e.target.value;
        setStatus(`줄 간격 ${e.target.value}배로 적용됨`);
      });
      zoomSelect.addEventListener('change', (e) => {
        const value = Number(e.target.value);
        editor.style.zoom = value;
        setStatus(`확대 비율 ${value * 100}%`);
      });

      spellToggle.addEventListener('click', () => {
        const enabled = !spellToggle.classList.contains('active');
        setSpellcheck(enabled);
      });
      darkToggle.addEventListener('click', () => {
        const enabled = !darkToggle.classList.contains('active');
        setDarkMode(enabled);
      });

      imageInput.addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        if (file) insertImageFromFile(file);
        event.target.value = '';
      });

      fontInput.addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        if (file) addCustomFont(file);
        event.target.value = '';
      });

      document.getElementById('newDocBtn').addEventListener('click', () => {
        const ok = confirm('현재 문서를 초기화하고 새 문서를 시작할까요?');
        if (!ok) return;
        editor.innerHTML = '<p style="margin: 0;">새 문서를 시작하세요.</p>';
        updateStats();
        editor.focus();
      });

      document.getElementById('downloadBtn').addEventListener('click', () => {
        const mode = confirm('DOCX 파일로 저장하시겠습니까?\n취소하면 HTML로 다운로드합니다.');
        if (mode) {
          exportDocx();
          return;
        }
        const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Document</title></head><body>' + editor.innerHTML + '</body></html>';
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'document.html';
        a.click();
        URL.revokeObjectURL(a.href);
        setStatus('HTML 문서 다운로드 완료');
      });

      editor.addEventListener('input', updateStats);
      editor.addEventListener('keyup', updateStats);
      editor.addEventListener('mouseup', updateStats);

      setSpellcheck(true);
      setDarkMode(false);
      updateStats();
    </script>
  </body>
</html>
